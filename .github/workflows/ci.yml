# Integración continua.
#
# Existe para que un merge roto se detecte en el PR y no lo herede el resto del equipo.
# Somos cuatro: si alguien mergea algo que no compila o que no está formateado, los otros
# tres se lo llevan puesto en su próximo rebase.
#
# Los dos jobs corren en paralelo y son independientes.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si se pushea de nuevo a un PR, cancela la corrida anterior en vez de encolarla.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 'verify' compila, corre los tests y ejecuta spotless:check.
      # Si alguien no corrió "mvn spotless:apply", falla acá.
      - name: Compilar, testear y chequear formato
        run: mvn -B verify

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 'npm ci' instala exactamente lo que dice package-lock.json y falla si el lock
      # quedó desincronizado de package.json — que es justo el síntoma de un merge
      # mal resuelto del lock.
      - name: Instalar dependencias
        run: npm ci

      - name: Chequear formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
