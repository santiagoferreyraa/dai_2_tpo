spring:
  application:
    name: ecopedia-integration

# Sin datasource: este módulo no tiene tablas propias. Su estado vive en los sistemas
# externos con los que habla. Si eso cambia, copiar el bloque de datasource + flyway
# de ecopedia-core y agregar las dependencias correspondientes al pom.
server:
  port: ${SERVER_PORT:8083}

# --- Sistemas externos simulados ---
# Todavía no existen: se levantan como procesos aparte en entregas siguientes.
# Ver ARQUITECTURA_ECOPEDIA.md §3.1 y §3.2.
ecopedia:
  payment-gateway:
    url: ${ECOPEDIA_PAYMENT_GATEWAY_URL:http://localhost:8091}
  power-grid:
    url: ${ECOPEDIA_POWER_GRID_URL:http://localhost:8092/ws}
