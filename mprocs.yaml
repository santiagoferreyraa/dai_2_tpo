# Procesos de desarrollo. Los levanta `pnpm dev`.
#
# mprocs muestra los tres en la misma terminal pero SEPARADOS: la lista de procesos queda a
# la izquierda y el log del que esté seleccionado ocupa el resto. Cada uno conserva su
# propio scroll, así que el log del backend no se mezcla con el de Vite. Las teclas están
# siempre a la vista, en el recuadro de ayuda de abajo a la izquierda.
#
# La ventaja sobre correr los tres con prefijos en la misma consola no es solo visual: desde
# el TUI se reinicia UNO SOLO —el backend después de tocar una clase, por ejemplo— sin
# bajar el otro ni perder el estado del navegador.
#
# Los comandos son los mismos scripts del package.json, no comandos sueltos: así `pnpm dev`
# y `pnpm dev:back` levantan exactamente lo mismo y no hay dos definiciones que mantener
# sincronizadas.
#
# `charging` es Reservas, en su propio proceso (8082). Necesita a `back` arriba: antes de retener
# un slot le pregunta a core por el conector.
#
# ---
#
# Éste es el ambiente PROPIO Y PERSISTENTE: perfil `local`, H2 en archivo. Tus datos
# sobreviven a bajar y volver a levantar, y no necesitás Docker ni instalar nada.
#
# Hay un hermano de este archivo, para el ambiente descartable:
#
#   mprocs-mem.yaml   ->  `pnpm dev:mem`   H2 en memoria, se borra al bajar
#
# Cuándo usar cada uno está en el README, sección "Cómo levantar el proyecto".
procs:
  back:
    shell: pnpm dev:back
  charging:
    shell: pnpm dev:charging
  front:
    shell: pnpm dev:front
