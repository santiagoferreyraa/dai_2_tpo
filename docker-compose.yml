# Infraestructura local de EcoCharge.
#
#   docker compose up -d
#
# Levanta lo que la consigna exige tener "realmente configurado y funcionando":
# la base de datos y el broker de mensajería.

services:

  postgres:
    image: postgres:16-alpine
    container_name: ecocharge-postgres
    environment:
      POSTGRES_DB: ecocharge
      POSTGRES_USER: ecocharge
      POSTGRES_PASSWORD: ecocharge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecocharge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker JMS. Elegimos ActiveMQ sobre RabbitMQ porque habla el mismo vocabulario
  # que la consigna: cola punto a punto = Queue, tópico pub/sub = Topic.
  # Ver ARQUITECTURA_ECOCHARGE.md §1.2.
  activemq:
    image: apache/activemq-artemis:2.42.0
    container_name: ecocharge-activemq
    environment:
      ARTEMIS_USER: ecocharge
      ARTEMIS_PASSWORD: ecocharge
    ports:
      - "61616:61616"   # protocolo core / JMS
      - "8161:8161"     # consola web: http://localhost:8161/console
    volumes:
      - activemq-data:/var/lib/artemis-instance

volumes:
  postgres-data:
  activemq-data:
